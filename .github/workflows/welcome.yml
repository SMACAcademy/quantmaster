# Thanks first-time contributors and points them to the next step.
# Uses pull_request_target only to comment; it never checks out or runs the contributor's code.
name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isPr = context.eventName === "pull_request_target";
            const item = isPr ? context.payload.pull_request : context.payload.issue;
            const author = item.user.login;
            if (item.user.type === "Bot") return;
            const { owner, repo } = context.repo;
            const kind = isPr ? "pr" : "issue";
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} type:${kind} author:${author}`,
              per_page: 2,
            });
            if (found.data.total_count > 1) return;
            const body = isPr
              ? `Thanks for your first pull request, @${author}! 🎉 The checks run automatically; a maintainer will review it soon. If anything needs changing, we'll comment here.`
              : `Thanks for opening your first issue, @${author}! If you'd like to fix it yourself, say so here and see [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md). Meanwhile, this week's puzzle is waiting in [Discussions](https://github.com/${owner}/${repo}/discussions/categories/q-a).`;
            await github.rest.issues.createComment({ owner, repo, issue_number: item.number, body });
