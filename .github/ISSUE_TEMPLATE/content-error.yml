name: Content error
description: A wrong answer, a confusing question, or a figure that does not match its text.
labels: [content]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: For example "Time and Work" or "Mensuration 2D".
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question
      description: Paste the question text, or add a screenshot.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What you think the right answer or wording is, and your working.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Anything that shows the correction is right, for example your full working, a textbook reference, or the official notification for an exam detail. Screenshots are welcome.
    validations:
      required: false
