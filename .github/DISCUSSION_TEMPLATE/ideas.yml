title: "Idea: "
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: A missing topic from your exam, a simulation you wish existed, a feature. What would a learner get from it?
    validations:
      required: true
  - type: input
    id: exam
    attributes:
      label: Which exam is it for?
      description: Optional. For example CAT, SBI PO, SSC CGL, RRB NTPC, TCS NQT.
  - type: textarea
    id: example
    attributes:
      label: An example question
      description: Optional. A question in your own words that shows the idea.
